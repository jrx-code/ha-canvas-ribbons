stages:
  - validate

validate:
  stage: validate
  tags: [shell]
  script:
    - test -f dist/ha-canvas-ribbons.js && echo "JS file exists" || exit 1
    - test -s dist/ha-canvas-ribbons.js && echo "JS file non-empty" || exit 1
    - test -f package.json && echo "package.json exists" || exit 1
    - test -f hacs.json && echo "hacs.json exists" || exit 1
    - python3 -c "import json; json.load(open('package.json')); print('package.json valid')"
    - python3 -c "import json; json.load(open('hacs.json')); print('hacs.json valid')"
    - grep -q 'const VERSION' dist/ha-canvas-ribbons.js && echo "VERSION found" || exit 1
    - echo "Validate OK"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "publish"
